robot_2:
  # ==============================================================================
  # Nav2 Parameters for Robot 2 (ATR-600 Heavy-Lift AMR)
  # Solid lethal obstacle mapping for all shelves, delivery tables, and docks
  # Inflated clearance ensures robots cannot squeeze through gaps < 2x robot width
  # ==============================================================================

  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: robot_2/base_link
      odom_topic: /robot_2/odom
      bt_loop_duration: 10
      default_server_timeout: 20
      enable_groot_monitoring: true

  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.25
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.15
        yaw_goal_tolerance: 0.1
        transform_tolerance: 0.1

      FollowPath:
        plugin: "nav2_orca_controller::OrcaLocalPlanner"
        time_horizon: 5.5
        time_horizon_obstacle: 2.5
        max_speed: 1.0
        max_angular_speed: 1.6
        neighbor_distance: 8.0
        robot_radius: 0.48             # Matches ATR-600 heavy footprint
        min_safe_distance: 0.55
        speed_scale_factor: 1.0

  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 10.0
      planner_plugins: ["GridBased", "DStarLite"]

      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.2
        use_astar: true
        allow_unknown: false

      DStarLite:
        plugin: "nav2_dstar_planner::DStarLitePlanner"
        tolerance: 0.2
        replan_frequency: 5.0
        dynamic_costmap_subscription: true

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: map
        robot_base_frame: robot_2/base_link
        robot_radius: 0.48
        resolution: 0.05
        track_unknown_space: false
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
          lethal_cost_threshold: 100

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /robot_2/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 2.5
          inflation_radius: 0.96
          inflate_unknown: false

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 10.0
        publish_frequency: 5.0
        global_frame: map
        robot_base_frame: robot_2/base_link
        rolling_window: true
        width: 6.0
        height: 6.0
        resolution: 0.05
        robot_radius: 0.48
        plugins: ["voxel_layer", "inflation_layer"]

        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.1
          z_voxels: 16
          max_obstacle_height: 2.0
          observation_sources: scan
          scan:
            topic: /robot_2/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.5
          inflation_radius: 0.80

  behavior_server:
    ros__parameters:
      use_sim_time: true
      costmap_topic: /robot_2/local_costmap/costmap_raw
      footprint_topic: /robot_2/local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
      backup:
        plugin: "nav2_behaviors/BackUp"
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: map
      robot_base_frame: robot_2/base_link
      transform_timeout: 0.1

  velocity_smoother:
    ros__parameters:
      use_sim_time: true
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [1.0, 0.0, 1.6]
      min_velocity: [-0.25, 0.0, -1.6]
      max_accel: [0.6, 0.0, 1.2]
      max_decel: [-1.0, 0.0, -2.0]
      deadband_velocity: [0.0, 0.0, 0.0]
